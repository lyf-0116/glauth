#################
# glauth.conf

#################
# General configuration.
#debug = true
syslog = true

#################
# Server configuration.
[ldap]
  enabled = true
  listen = "0.0.0.0:389"

[ldaps]
  enabled = true
  listen = "0.0.0.0:636"
  cert = "glauth.crt"
  key = "glauth.key"

#################
# Process-wide TLS policy. The minimum version below also governs outbound
# LDAPS connections to the backend servers: upstreams unable to negotiate at
# least this version are rejected. 771 = TLS 1.2 (default), 772 = TLS 1.3.
[tls]
  # minversion = 771

#################
# The backend section controls the data store.
[backend]
  datastore = "ldap"
  servers = [ "ldaps://server1:636", "ldaps://server2:636" ]

  # Ignore SSL certificate errors when connecting to backend LDAP servers.
  #insecure = true

#################
# Enable and configure the optional REST API here.
[api]
  enabled = true
  tls = true
  listen = "localhost:5555"
  cert = "glauth.crt"
  key = "glauth.key"

